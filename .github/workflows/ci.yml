# GitHub Actions workflow docs: https://docs.github.com/en/actions
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7
      # Installs uv and the pinned Python toolchain:
      # https://github.com/astral-sh/setup-uv
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      # Resolves dependencies from the committed uv.lock and creates the venv:
      # https://docs.astral.sh/uv/reference/cli/#uv-sync
      - name: Install dependencies
        run: uv sync --locked
      # Same script developers run locally; see scripts/check.sh
      - name: Run all checks (ruff lint + format, pyright, pytest)
        run: ./scripts/check.sh

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node for the pinned mermaid-cli: https://github.com/actions/setup-node
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Installs exactly the versions in package-lock.json:
      # https://docs.npmjs.com/cli/commands/npm-ci
      - name: Install mermaid-cli
        run: npm ci
      # mermaid-cli renders in chrome-headless-shell; install the build the pinned Puppeteer
      # expects, in case npm skipped Puppeteer's own download script:
      # https://pptr.dev/browsers-api
      - name: Install headless Chrome
        run: npx puppeteer browsers install chrome-headless-shell
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      # Renders every docs/architecture/*.mmd into a temporary folder and fails on a
      # diagram that does not render, a missing PNG or a stale PNG.
      - name: Check architecture diagrams
        run: uv run python scripts/render_diagrams.py --check
